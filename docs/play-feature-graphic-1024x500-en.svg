  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="452" y="200" fill="#FFFFFF" font-size="88" font-weight="800" letter-spacing="-1">Sitecar</text>
    <text x="452" y="250" fill="#bfe3ff" font-size="34" font-weight="600">for Papra</text>
    <text x="452" y="308" fill="#dbeefc" font-size="26" font-weight="400">Scan, organize, and upload documents to</text>
