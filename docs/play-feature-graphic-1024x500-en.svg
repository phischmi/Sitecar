               M81,81 L65,81 L65,78 L78,78 L78,65 L81,65 Z"/>
      <path fill="url(#doc)"
            d="M43,36 L59,36 L69,46 L69,68 A4,4 0 0 1 65,72 L43,72 A4,4 0 0 1 39,68 L39,40 A4,4 0 0 1 43,36 Z"/>
      <path fill="url(#fold)" d="M59,36 L69,36 L69,46 Z"/>
      <path fill="#AEB9F2" d="M45,53 h18 a2,2 0 0 1 0,4 h-18 a2,2 0 0 1 0,-4 Z"/>
      <path fill="#AEB9F2" d="M45,62 h18 a2,2 0 0 1 0,4 h-18 a2,2 0 0 1 0,-4 Z"/>
