<?xml version="1.0" encoding="UTF-8"?>
<!-- Sitecar Play-Store-Vorstellungsgrafik (Feature Graphic), 1024x500, Englisch.
     Gleiches Indigo-Branding/Icon-Motiv wie docs/play-icon-512.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="doc" x1="39" y1="36" x2="69" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE1FB"/>
    </linearGradient>
    <linearGradient id="fold" x1="59" y1="36" x2="69" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F3FE"/>
      <stop offset="100%" stop-color="#9BA8EE"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00121f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

